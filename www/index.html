<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>开黑启动器</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(circle at 20% 0%, #1b2436 0%, #0b0f18 55%, #080a10 100%);
    color: #e8eefc;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* ---------- 顶栏 ---------- */
  header {
    flex: none; display: flex; align-items: center; gap: 14px;
    padding: 10px 18px;
    border-bottom: 1px solid rgba(255,255,255,.08);
    background: rgba(10,14,24,.6);
  }
  header .logo { font-size: 16px; font-weight: 600; letter-spacing: .5px; }
  header .cur {
    font-size: 12px; color: #8ea3c8;
    padding: 3px 10px; border-radius: 999px;
    background: rgba(78,161,255,.14); border: 1px solid rgba(78,161,255,.3);
  }
  header .hint { margin-left: auto; font-size: 12px; color: #66788f; }

  /* ---------- 右上角：名字登记栏 ---------- */
  .name-reg { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .name-reg label { font-size: 12px; color: #8ea3c8; }
  .name-reg input {
    width: 130px; padding: 6px 10px; border-radius: 8px; font-size: 13px; font-family: inherit;
    border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.07);
    color: #e8eefc; outline: none;
  }
  .name-reg input:focus { border-color: #4ea1ff; }
  /* 没登记名字时：红框 + 抖一下，引导去填（聊天/表情/选游戏被拦时也闪这里） */
  .name-reg input.flash {
    border-color: #ff6b6b;
    animation: vsw-shake .3s 2;
  }
  .name-reg .name-tip { font-size: 11px; color: #66788f; }

  /* ---------- 主体：左栏 + 游戏窗口 ---------- */
  .layout { flex: 1; display: flex; min-height: 0; }

  aside {
    width: 232px; flex: none;
    display: flex; flex-direction: column;
    border-right: 1px solid rgba(255,255,255,.08);
    background: rgba(10,14,24,.45);
  }
  .brand { padding: 16px 16px 10px; }
  .brand h1 { margin: 0; font-size: 18px; font-weight: 600; }
  .brand h1 .refresh {
    margin-left: 6px; padding: 2px 8px; font-size: 13px;
    background: rgba(255,255,255,.06); color: #8ea3c8;
    border: 1px solid rgba(255,255,255,.12); border-radius: 7px; cursor: pointer;
  }
  .brand h1 .refresh:hover { background: rgba(78,161,255,.16); color: #cfe2ff; }
  .brand .sub { margin-top: 3px; font-size: 11px; color: #7f90b0; letter-spacing: .4px; }

  .gamelist { flex: 1; overflow-y: auto; padding: 8px; }
  .game-item {
    position: relative;
    display: flex; gap: 10px; align-items: center;
    padding: 10px 11px; margin-bottom: 4px;
    border-radius: 11px; cursor: pointer;
    border: 1px solid transparent;
  }
  .game-item:hover { background: rgba(255,255,255,.05); }
  .game-item.active {
    background: rgba(78,161,255,.14);
    border-color: rgba(78,161,255,.35);
  }
  .game-item .icon { font-size: 21px; flex: none; line-height: 1; }
  .game-item .icon img {
    width: 28px; height: 28px; border-radius: 7px;
    object-fit: cover; display: block;
    background: rgba(255,255,255,.06);
  }
  .game-item .meta { min-width: 0; }
  .game-item .meta b {
    display: block; font-size: 13px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .game-item .meta span {
    display: block; font-size: 11px; color: #7f90b0; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .game-item .meta .state { font-size: 10px; margin-top: 3px; letter-spacing: .5px; }
  .game-item .meta .state.run { color: #06d6a0; }
  .game-item .meta .state:not(.run) { color: #66788f; }

  /* ---------- 删除按钮（每个游戏左上角的小叉）----------
     平时半透明低调，鼠标移到这个游戏上才变清晰；点一下弹确认框再删。
     只有房主能删（好友点会被拒绝 + 提示）。 */
  .game-item .del {
    position: absolute; left: 2px; top: 2px;
    width: 16px; height: 16px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 50%;
    background: none; color: #6c7f9c;
    font-size: 11px; line-height: 1; font-family: inherit;
    cursor: pointer; opacity: .35;
    transition: opacity .15s, background .15s, color .15s;
  }
  .game-item:hover .del { opacity: 1; }
  .game-item .del:hover { background: rgba(255,86,86,.92); color: #fff; }
  .game-item .del.locked { cursor: not-allowed; }
  .game-item .del.locked:hover { background: rgba(255,255,255,.12); color: #8ea3c8; }
  .game-item .del.busy { pointer-events: none; opacity: .6; }
  .game-item .del.shake { animation: vsw-shake .3s; }

  /* ---------- 游戏启停开关（联机游戏才有）----------
     上下滑动：上是开（绿色、滑块在上），下是关（灰色、滑块在下）。
     只有房主（开服务器那台电脑）拨得动；好友看到的是半透明锁定态。 */
  .game-item .vsw {
    flex: none; position: relative; width: 24px; height: 42px; padding: 0;
    border: 1px solid rgba(255,255,255,.16); border-radius: 999px;
    background: rgba(255,255,255,.07); cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .game-item .vsw .knob {
    position: absolute; left: 50%; top: 21px; width: 16px; height: 16px;
    margin-left: -8px; border-radius: 50%;
    background: #8ea3c8; box-shadow: 0 1px 3px rgba(0,0,0,.4);
    transition: top .15s, background .15s;
  }
  .game-item .vsw:hover { border-color: rgba(78,161,255,.5); }
  .game-item .vsw.on { background: rgba(6,214,160,.22); border-color: rgba(6,214,160,.55); }
  .game-item .vsw.on .knob { top: 3px; background: #06d6a0; }
  .game-item .vsw.locked { opacity: .45; cursor: not-allowed; }
  .game-item .vsw.busy { pointer-events: none; opacity: .6; }
  .game-item .vsw.shake { animation: vsw-shake .3s; }
  @keyframes vsw-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    75% { transform: translateX(3px); }
  }

  /* 轻提示（启停失败 / 非房主点拨动开关） */
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 20;
    padding: 9px 16px; border-radius: 10px; font-size: 13px; color: #ffe9c9;
    background: rgba(60,40,16,.92); border: 1px solid rgba(255,209,102,.4);
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  .empty { padding: 26px 14px; text-align: center; font-size: 12px; color: #66788f; line-height: 1.9; }

  .add-btn {
    margin: 8px; padding: 11px;
    background: transparent; color: #9fc2f5;
    border: 1px dashed rgba(120,170,255,.45); border-radius: 11px;
    font-size: 13px; font-family: inherit; cursor: pointer;
  }
  .add-btn:hover { background: rgba(78,161,255,.1); color: #cfe2ff; }

  main { flex: 1; min-width: 0; padding: 12px; display: flex; flex-direction: column; }
  iframe {
    flex: 1; min-height: 0; border: 1px solid rgba(120,170,255,.25); border-radius: 14px;
    background: #0b1119;
  }

  /* ---------- 表情栏（启动器组件）----------
     游戏窗口正下方、一样宽；左边是动态（聊天 + 表情，带名字），
     右边是选择区 + 聊天输入框。
     表情和聊天都是启动器自己的功能，走 /api/chat，与游戏无关。
     整体压到约两行表情按钮高：12 个表情 6 个/行两行排完，
     动态栏固定高约 4 条（116px），与右侧操作区齐平。 */
  .emote-bar {
    flex: none; display: flex; gap: 12px; align-items: stretch;
    min-height: 130px;
    margin-top: 10px; padding: 9px 12px;
    border: 1px solid rgba(120,170,255,.25); border-radius: 12px;
    background: rgba(10,14,24,.45);
  }
  .emote-feed {
    flex: 1; min-width: 0; overflow-y: auto;
    height: 116px;                     /* 约 4 条可见（23~26px/条 + 4px 间距），超出滚动 */
    display: flex; flex-direction: column; gap: 4px;
    padding-right: 4px;
  }
  .feed-empty { font-size: 12px; color: #66788f; padding: 6px 2px; }
  .feed-item {
    display: flex; align-items: center; gap: 8px; flex: none;
    padding: 3px 10px; border-radius: 8px;
    background: rgba(255,255,255,.045);
    font-size: 12px; color: #9fb2d0;
  }
  .feed-item b { font-weight: 500; color: #c4d2ea; max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .feed-item span { font-size: 17px; line-height: 1; }
  .feed-item.me { background: rgba(78,161,255,.13); }
  .feed-item.me b { color: #9fc2f5; }
  .feed-item.txt span { font-size: 13px; line-height: 1.5; word-break: break-word; }

  /* 聊天输入框 + 发送按钮（启动器自己的聊天室，与游戏无关） */
  .chat-row { flex: none; display: flex; gap: 6px; }
  .chat-row input {
    flex: 1; min-width: 0; padding: 5px 10px; border-radius: 8px; font-size: 13px; font-family: inherit;
    border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.07);
    color: #e8eefc; outline: none;
  }
  .chat-row input:focus { border-color: #4ea1ff; }
  .chat-row button {
    flex: none; width: 38px; padding: 0; font-size: 15px;
    background: rgba(78,161,255,.22); color: #cfe2ff;
    border: 1px solid rgba(78,161,255,.45); border-radius: 8px; cursor: pointer;
  }
  .chat-row button:hover { background: rgba(78,161,255,.35); }
  .emote-side { flex: none; width: 232px; display: flex; flex-direction: column; gap: 5px; }
  .emote-list { flex: 1; display: flex; flex-wrap: wrap; gap: 5px; align-content: flex-start; }
  .emote-list button {
    width: 30px; height: 30px; padding: 0; font-size: 17px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.06); color: #e8eefc;
    border: 1px solid rgba(255,255,255,.1); border-radius: 9px; cursor: pointer;
    transition: transform .08s, background .12s;
  }
  .emote-list button:hover { background: rgba(78,161,255,.18); }
  .emote-list button:active { transform: scale(.85); }
  /* 没登记名字：聊天/表情整体停用（去右上角登记后自动恢复） */
  .emote-list button:disabled { opacity: .35; cursor: not-allowed; }
  .chat-row input:disabled { opacity: .5; cursor: not-allowed; }
  .chat-row button:disabled { opacity: .35; cursor: not-allowed; }
  .emote-sent { flex: none; text-align: right; font-size: 11px; color: #8ea3c8; min-height: 13px; }

  /* ---------- 添加游戏弹框 ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(5,8,14,.72);
    display: flex; align-items: center; justify-content: center;
  }
  .modal.hidden { display: none; }
  .dialog {
    width: 360px; max-width: calc(100vw - 40px);
    background: #141b2a; border: 1px solid rgba(255,255,255,.12);
    border-radius: 16px; padding: 20px 22px;
    box-shadow: 0 24px 70px rgba(0,0,0,.6);
  }
  .dialog h2 { margin: 0 0 4px; font-size: 16px; }
  .dialog .tip { font-size: 12px; color: #7f90b0; line-height: 1.8; margin: 0 0 14px; }
  .dialog label { display: block; font-size: 12px; color: #8ea3c8; margin: 10px 0 5px; }
  .dialog input {
    width: 100%; padding: 9px 11px; border-radius: 9px; font-size: 14px; font-family: inherit;
    border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.07);
    color: #e8eefc; outline: none;
  }
  .dialog input:focus { border-color: #4ea1ff; }
  .dialog .err { min-height: 18px; font-size: 12px; color: #ff9f9f; margin-top: 8px; }
  .dialog .warn { font-size: 12px; color: #ffd166; line-height: 1.7; margin-top: 8px; }
  .dialog code {
    background: rgba(255,255,255,.09); padding: 1px 6px; border-radius: 5px;
    font-family: Consolas, monospace; color: #ffd166; font-size: 12px;
  }
  .hidden { display: none !important; }

  /* 文件夹选择区 */
  .pick-zone {
    margin: 4px 0 2px; padding: 16px 14px; text-align: center;
    border: 1px dashed rgba(120,170,255,.45); border-radius: 12px;
    background: rgba(78,161,255,.06);
  }
  .pick-zone:hover { background: rgba(78,161,255,.1); }
  .pick-zone .pick-btn {
    padding: 9px 22px; font-size: 13px; font-weight: 600;
    background: linear-gradient(180deg, #4ea1ff, #2f7fe0); color: #04101f;
  }
  .pick-info { margin-top: 10px; font-size: 12px; color: #8ea3c8; line-height: 1.8; }
  .pick-info b { color: #cfe2ff; }

  /* 导入进度条 */
  .prog { margin-top: 10px; }
  .prog .track { height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
  .prog .bar { height: 100%; width: 0; background: #4ea1ff; transition: width .15s; }
  .prog .txt { margin-top: 6px; font-size: 12px; color: #8ea3c8; }
  .dialog .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .dialog button {
    padding: 9px 18px; border: none; border-radius: 9px; cursor: pointer;
    font-size: 13px; font-family: inherit; font-weight: 600;
  }
  .btn-ghost { background: rgba(255,255,255,.08); color: #c4d2ea; }
  .btn-primary { background: linear-gradient(180deg, #4ea1ff, #2f7fe0); color: #04101f; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>

<header>
  <div class="logo">🎮 开黑启动器</div>
  <div class="cur" id="curName">载入中…</div>
  <div class="name-reg">
    <label for="playerName">名字登记</label>
    <input id="playerName" maxlength="10" placeholder="10 字以内">
    <span class="name-tip">进游戏就用这个名字</span>
  </div>
</header>

<div class="layout">
  <aside>
    <div class="brand">
      <h1>游戏库 <button class="refresh" id="refreshBtn" title="重新扫描 gamemode 目录">⟳</button></h1>
      <div class="sub">点游戏右边开打 · 每行开关：上=开，下=关（房主）</div>
    </div>
    <div class="gamelist" id="list"></div>
    <button class="add-btn" id="addBtn">＋ 添加游戏</button>
  </aside>
  <main>
    <iframe id="stage" title="游戏窗口" src="about:blank"></iframe>
    <div class="emote-bar" id="emoteBar">
      <div class="emote-feed" id="emoteFeed">
        <div class="feed-empty">聊天和表情动态会显示在这里（自己 + 服务器里的所有人）</div>
      </div>
      <div class="emote-side">
        <div class="emote-list" id="emoteList"></div>
        <div class="chat-row">
          <input id="chatInput" type="text" maxlength="120" placeholder="打字聊天，回车发送…" autocomplete="off">
          <button id="chatSend" type="button" title="发送">➤</button>
        </div>
        <div class="emote-sent" id="emoteSent"></div>
      </div>
    </div>
  </main>
</div>

<div class="toast hidden" id="toast"></div>

<div class="modal hidden" id="modal">
  <div class="dialog">
    <h2>添加游戏</h2>
    <p class="tip">从任意磁盘选择游戏文件夹，里面的所有文件会复制进 <code>gamemode/</code>。<br>
       文件夹里最好有 <code>game.json</code>（名称/简介/入口以它为准），没有也能导入。</p>
    <div class="pick-zone" id="pickZone">
      <button type="button" class="pick-btn" id="pickBtn">选择游戏文件夹</button>
      <input type="file" id="dirPicker" webkitdirectory hidden>
      <div class="pick-info" id="pickInfo">还没选择文件夹</div>
    </div>
    <label for="gname">游戏名称（最多 12 字，可改）</label>
    <input id="gname" maxlength="12" placeholder="例如：贪吃蛇大作战">
    <label for="gdesc">简介（可选，最多 60 字）</label>
    <input id="gdesc" maxlength="60" placeholder="一句话说明这个游戏怎么玩">
    <div class="warn" id="gWarn"></div>
    <div class="err" id="gErr"></div>
    <div class="prog hidden" id="gProg">
      <div class="track"><div class="bar" id="gBar"></div></div>
      <div class="txt" id="gProgTxt"></div>
    </div>
    <div class="row">
      <button class="btn-ghost" id="cancelBtn">取消</button>
      <button class="btn-primary" id="importBtn" disabled>导入</button>
    </div>
  </div>
</div>

<script src="/launcher.js"></script>
</body>
</html>
